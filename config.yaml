# ── Parametri del dominio ─────────────────────────────────────────────────────
domain:
  mu0_min: 0.1
  mu0_max: 10.0
  mu1_min: 1.0
  mu1_max: 3.0

# ── Mesh ─────────────────────────────────────────────────────────────────────
mesh:
  size: 0.001

# ── Newton (FOM e ROM) ────────────────────────────────────────────────────────
newton:
  tol: 1.0e-6
  max_iter: 20

# ── POD ──────────────────────────────────────────────────────────────────────
pod:
  tol: 0.99999999
  n_max: 100

# ── POD-NN: architettura ─────────────────────────────────────────────────────
podnn:
  hidden_layers: 4
  nodes: 128
  seed: 31

# ── POD-NN: training ─────────────────────────────────────────────────────────
training:
  epoch_max: 50000
  lr: 1.0e-3
  lr_decay: 1.0e-4
  lr_decay_epoch: 20000
  tol: 1.0e-5

# ── PINN ─────────────────────────────────────────────────────────────────────
pinn:
  layers:         [4, 128, 128, 128, 128, 3]
  seed:           42
  n_pde:          2000
  n_bc:           500
  n_gauge:        20
  k_data:         20
  w_bc:           10.0
  w_div:          3.0
  w_data:         2.0
  n_pretrain:     500
  n_epochs_adam:  10000
  lr_adam:        1.0e-3
  n_steps_lbfgs:  10000
  train_split:    0.8
  split_seed:     0
  coords:   ./data/mesh_coords_p1.npy
  params:   ./data/params_pinn.npy
  ux_nodes: ./data/ux_on_nodes.npy
  uy_nodes: ./data/uy_on_nodes.npy
  p_nodes:  ./data/p_on_nodes.npy

# ── Confronto ────────────────────────────────────────────────────────────────
compare:
  n_compare: 200
  seed: 42

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  data:      ./data
  models:    ./models
  results:   ./results
  pod_basis: ./data/pod_basis.npy
