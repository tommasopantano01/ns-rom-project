# ── Parametri del dominio ─────────────────────────────────────────────────────
domain:
  mu0_min: 0.1
  mu0_max: 10.0
  mu1_min: 1.0
  mu1_max: 3.0

# ── Mesh ─────────────────────────────────────────────────────────────────────
mesh:
  size: 0.001

# ── Newton (FOM e ROM) ────────────────────────────────────────────────────────
newton:
  tol: 1.0e-6
  max_iter: 20

# ── POD ──────────────────────────────────────────────────────────────────────
pod:
  tol: 0.99999999
  n_max: 100

# ── POD-NN: architettura ─────────────────────────────────────────────────────
podnn:
  hidden_layers: 4
  nodes: 128
  seed: 31

# ── POD-NN: training ─────────────────────────────────────────────────────────
training:
  epoch_max: 50000
  lr: 1.0e-3
  lr_decay: 1.0e-4
  lr_decay_epoch: 20000
  tol: 1.0e-5

# ── Confronto ────────────────────────────────────────────────────────────────
compare:
  n_compare: 200
  seed: 42

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  data:      ./data
  models:    ./models
  results:   ./results
  pod_basis: ./data/pod_basis.npy
